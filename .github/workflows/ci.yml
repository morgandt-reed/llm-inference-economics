name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  # Pinned: ruff's default rule set moves between releases, and an unpinned
  # linter turns a green build red with no commit behind it.
  RUFF_VERSION: "0.6.9"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      # Rules and line length come from pyproject.toml. No --ignore, no `|| true`.
      - name: Run Ruff
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Includes the provenance suite, which asserts every entry in the shipped
      # price file carries a source URL and an as-of date. The coverage floor is
      # in pyproject.toml.
      - name: Run tests
        run: pytest

  provenance:
    name: Every published price is traceable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: pip install -e ".[dev]"

      # Run separately from the main suite so this failure is legible in the
      # checks list rather than buried. The claim it defends is the one the
      # repository would most deserve to be disbelieved for getting wrong: that
      # every number published here can be traced to a page and a date.
      - name: Provenance
        run: pytest tests/test_prices.py::TestProvenanceIsEnforced -v --no-cov

  readme:
    name: The README's worked example still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: pip install -e .

      # Every command the README shows, run exactly as written. A README that
      # documents a CLI it has drifted away from is worse than no README, because
      # a reader has no way to tell which half is stale.
      - name: inference-econ prices
        run: inference-econ prices

      - name: inference-econ compare
        run: inference-econ compare

      - name: inference-econ breakeven (correct comparator)
        run: inference-econ breakeven

      - name: inference-econ breakeven (the rigged comparison)
        run: inference-econ breakeven --model claude-opus-5

      - name: inference-econ sensitivity
        run: inference-econ sensitivity

      # The README quotes this table verbatim. If the rendering changes, the
      # golden file changes, and this fails until both are updated together.
      - name: The committed table matches the CLI
        run: |
          inference-econ compare --prices data/prices-2026-07.yaml > /tmp/compare.txt
          diff -u tests/golden/compare.txt /tmp/compare.txt
