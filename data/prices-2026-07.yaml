      smaller family of models under Apache-2.0.

  # ---------------------------------------------------------------------------
  # Aggregator / gateway route
  #
  # One entry, to make the three-way comparison in the README concrete. This is
  # the cheapest listed provider for the model on a routing marketplace, not a
  # committed rate: the marketplace routes on price, providers enter and leave,
  # and the floor is whatever the most aggressive provider is charging this week.
  # ---------------------------------------------------------------------------
  - model_id: glm-5.2-aggregator
    display_name: GLM-5.2 (cheapest aggregator route)
    provider: OpenRouter
    tier: aggregator
    input_per_mtok: 0.42
    output_per_mtok: 1.32
    cached_input_per_mtok: null
    batch_discount: null
    promotional: true
    source_url: https://openrouter.ai/z-ai/glm-5.2
    as_of: 2026-08-01
    open_weights:
      available: true
      license: MIT
      license_url: https://opensource.org/licenses/MIT
    notes: >-
      Lowest listed per-token price on the linked page at the as-of date. The
      page shows these rates under a 70%-off promotion, so they are a discount
      window and not a rate card — a business case resting on them has an expiry
      date. No cached-input rate was verified for this route, so the model
      charges the full input rate for cache hits; the true cost of a cache-heavy
      profile here is therefore lower than this file can justify claiming.
