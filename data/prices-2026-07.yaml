    provider: Anthropic
    tier: first-party
    input_per_mtok: 10.00
    output_per_mtok: 50.00
    cached_input_per_mtok: 1.00
    batch_discount: 0.50
    context_window_tokens: 1000000
    source_url: https://platform.claude.com/docs/en/about-claude/models/overview
    as_of: 2026-08-01
    open_weights:
      available: false
    benchmark:
      name: SWE-bench Pro
      score: 80.0
      as_of: 2026-08-01
      source_url: https://llm-stats.com/benchmarks/swe-bench-pro
      notes: >-
        Vendor-aggregate leaderboard. Different standardisations of this
        benchmark report materially different numbers for the same model — see
        docs/adr/0003-reading-vendor-benchmarks.md.
    notes: >-
      Cached-input rate derived from the documented ~0.1x cache-read discount,
