# Published list prices for LLM inference, per million tokens, in USD.
#
# PROVENANCE — read this before using any number below.
#
#   These are *list prices transcribed from vendor pages on the date recorded in
#   each entry's `as_of` field*. They are not quotes, not negotiated rates, and
#   not measurements. Nobody here ran a benchmark or received an invoice.
#
#   They move, and they move fast. Over the twelve months to mid-2026 the floor
#   price for serving a frontier open-weight model fell by a large multiple, and
#   several of the entries below are explicitly marked `promotional: true`
#   because the price charged today is not the price on the rate card. A
#   business case built on a promotional rate is a business case with an expiry
#   date on it.
#
#   Re-check every entry against its `source_url` before you rely on it. If the
#   file's date stamp is more than a quarter old, treat the whole thing as
#   indicative and re-derive it.
#
# The schema each entry follows is documented in data/SCHEMA.md. The test suite
# enforces the parts that matter: every entry must carry a `source_url` and an
# `as_of` date, or the build fails.

version: 1
published: 2026-07
description: >-
  First-party API list prices, one aggregator floor price, open-weight licensing
  status, and — where a public leaderboard figure exists — a single dated
  benchmark score. Prices are USD per million tokens.

models:
  # ---------------------------------------------------------------------------
  # Anthropic — first-party API
  #
  # Cached-input rates are derived from the documented prompt-caching discount
  # (cache reads bill at approximately 0.1x the base input rate) rather than
  # being quoted per-model on the price list. The batch discount is 50% on both
  # input and output.
  # ---------------------------------------------------------------------------
  - model_id: claude-fable-5
